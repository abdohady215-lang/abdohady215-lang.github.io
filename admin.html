<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Sport - لوحة الإدارة والحذف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090a0f;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #ffb800;
            margin-bottom: 30px;
        }
        h1 { color: #ffb800; font-size: 1.8rem; }
        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-top: 5px; }

        .article-card {
            background: #12151e;
            border: 1px solid rgba(255, 184, 0, 0.2);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .article-info { flex-grow: 1; }
        .article-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .article-date { font-size: 0.8rem; color: #ffb800; }
        
        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 8px;
        }
        .badge-hidden { background: #ef4444; color: #fff; }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-delete { background: #ef4444; color: #fff; }
        .btn-delete:hover { background: #dc2626; }
        .btn-restore { background: #10b981; color: #fff; }
        .btn-restore:hover { background: #059669; }

        .loading { text-align: center; color: #94a3b8; padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>لوحة تحكم الأخبار ⚽</h1>
        <p class="subtitle">إدارة وحذف الأخبار المعروضة على موقع Zone Sport</p>
    </header>

    <div id="articlesList" class="loading">جاري فحص وجلب الأخبار...</div>

    <script>
        // 1. حماية الصفحة بكلمة سر
        const PASSWORD = "123"; // تقدر تغير كلمة السر دي لأي حاجة تحبها
        const userPass = prompt("أدخل كلمة المرور لدخول لوحة التحكم:");

        if (userPass !== PASSWORD) {
            alert("كلمة المرور خاطئة!");
            window.location.href = "index.html";
        }

        const BOT_TOKEN = "8983307628:AAEsacCBfEE6aCInlJ_2uv8UInmtlKM7W-U";

        // 2. دالة جلب وعرض الأخبار
        function loadAdminArticles() {
            let hiddenIds = JSON.parse(localStorage.getItem('hidden_articles') || '[]');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('articlesList');
                list.className = '';
                list.innerHTML = '';

                if (data.ok && data.result.length > 0) {
                    const validPosts = data.result.filter(item => item.channel_post || item.message);

                    if(validPosts.length === 0) {
                        list.innerHTML = '<div class="loading">لا توجد أخبار حالياً.</div>';
                        return;
                    }

                    validPosts.reverse().forEach(item => {
                        const msg = item.channel_post || item.message;
                        const id = msg.message_id;
                        let text = msg.text || msg.caption || "تغطية خاصة - Zone Sport";
                        let title = text.split('\n')[0];
                        let date = new Date(msg.date * 1000).toLocaleDateString('ar-EG', {
                            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        });

                        const isHidden = hiddenIds.includes(id);

                        const div = document.createElement('div');
                        div.className = 'article-card';
                        div.innerHTML = `
                            <div class="article-info">
                                <div class="article-title">
                                    ${title}
                                    ${isHidden ? '<span class="status-badge badge-hidden">محذوف من الموقع</span>' : ''}
                                </div>
                                <div class="article-date">🕒 ${date}</div>
                            </div>
                            <button class="btn ${isHidden ? 'btn-restore' : 'btn-delete'}" onclick="toggleHide(${id})">
                                ${isHidden ? 'إعادة إظهار' : 'حذف من الموقع'}
                            </button>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = '<div class="loading">تعذر جلب الأخبار من تليجرام.</div>';
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('articlesList').innerHTML = '<div class="loading">حدث خطأ أثناء الاتصال.</div>';
            });
        }

        // 3. دالة الحذف والإظهار
        function toggleHide(id) {
            let hiddenIds = JSON.parse(localStorage.getItem('hidden_articles') || '[]');
            if (hiddenIds.includes(id)) {
                hiddenIds = hiddenIds.filter(item => item !== id);
            } else {
                hiddenIds.push(id);
            }
            localStorage.setItem('hidden_articles', JSON.stringify(hiddenIds));
            loadAdminArticles();
        }

        // تشغيل الجلب عند التحميل
        loadAdminArticles();
    </script>
</body>
</html>
