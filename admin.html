<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Zone Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
        }

        .brand-logo span { color: var(--brand-gold); }

        .btn-site {
            background: var(--brand-gold);
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            text-decoration: none;
            font-size: 0.85rem;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: var(--brand-silver);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .admin-table th, .admin-table td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-table th {
            background: rgba(255, 184, 0, 0.1);
            color: var(--brand-gold);
            font-weight: 800;
        }

        .post-title-cell {
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .badge-visible { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-hidden { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .btn-toggle {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            transition: opacity 0.2s;
        }

        .btn-hide { background: var(--danger); color: #fff; }
        .btn-show { background: var(--success); color: #fff; }

        .spinner-container {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="https://abdohady215-lang.github.io/" class="brand-logo">ZONE <span>SPORT</span> - الإدارة</a>
            <a href="https://abdohady215-lang.github.io/" class="btn-site">عرض الموقع 🌐</a>
        </div>
    </header>

    <main>
        <h1 class="page-title">⚙️ إدارة عرض الأخبار</h1>
        
        <table class="admin-table">
            <thead>
                <tr>
                    <th># المعرف</th>
                    <th>عنوان الخبر</th>
                    <th>التاريخ</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="adminGrid">
                <tr>
                    <td colspan="5" class="spinner-container">جاري جلب المنشورات...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script>
        const BOT_TOKEN = "8983307628:AAEsacCBfEE6aCInlJ_2uv8UInmtlKM7W-U";

        async function fetchAdminPosts() {
            const tbody = document.getElementById('adminGrid');
            const hiddenArticles = JSON.parse(localStorage.getItem('hidden_articles') || '[]');
            const timestamp = new Date().getTime();

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?_=${timestamp}`);
                const data = await res.json();

                if (data.ok && data.result.length > 0) {
                    tbody.innerHTML = '';

                    const validPosts = data.result
                        .filter(item => item.channel_post || item.message)
                        .reverse();

                    validPosts.forEach(item => {
                        const msg = item.channel_post || item.message;
                        const id = msg.message_id;
                        let text = msg.text || msg.caption || "خبر بدون عنوان";
                        let title = text.split('\n')[0];
                        let date = new Date(msg.date * 1000).toLocaleDateString('ar-EG');
                        const isHidden = hiddenArticles.includes(id);

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><code>#${id}</code></td>
                            <td class="post-title-cell">${title}</td>
                            <td>${date}</td>
                            <td>
                                <span class="badge ${isHidden ? 'badge-hidden' : 'badge-visible'}">
                                    ${isHidden ? 'مخفي' : 'معروض'}
                                </span>
                            </td>
                            <td>
                                <button onclick="toggleVisibility(${id})" class="btn-toggle ${isHidden ? 'btn-show' : 'btn-hide'}">
                                    ${isHidden ? 'إظهار 👁️' : 'إخفاء 🚫'}
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد منشورات.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--danger);">خطأ في جلب البيانات.</td></tr>';
            }
        }

        function toggleVisibility(id) {
            let hiddenArticles = JSON.parse(localStorage.getItem('hidden_articles') || '[]');
            
            if (hiddenArticles.includes(id)) {
                hiddenArticles = hiddenArticles.filter(item => item !== id);
            } else {
                hiddenArticles.push(id);
            }

            localStorage.setItem('hidden_articles', JSON.stringify(hiddenArticles));
            fetchAdminPosts();
        }

        window.onload = fetchAdminPosts;
    </script>
</body>
</html>
