<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Zone Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        /* نافذة تسجيل الدخول */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--dark-bg);
        }

        .login-box {
            background: var(--card-bg);
            border: 2px solid var(--brand-gold);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .login-box h2 {
            color: var(--brand-silver);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-box h2 span { color: var(--brand-gold); }

        .login-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .login-input {
            width: 100%;
            padding: 14px 15px;
            background: #090A0F;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }

        .login-input:focus {
            border-color: var(--brand-gold);
            box-shadow: 0 0 10px rgba(255, 184, 0, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--brand-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-btn:hover { opacity: 0.9; }

        .error-msg {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            font-weight: 700;
        }

        /* لوحة التحكم (مخفية افتراضياً) */
        .admin-content {
            display: none;
        }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
        }

        .brand-logo span { color: var(--brand-gold); }

        .btn-site {
            background: var(--brand-gold);
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            margin-left: 10px;
        }

        .logout-btn:hover { background: var(--danger); color: #fff; }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: var(--brand-silver);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .admin-table th, .admin-table td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-table th {
            background: rgba(255, 184, 0, 0.1);
            color: var(--brand-gold);
            font-weight: 800;
        }

        .post-title-cell {
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .badge-visible { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-hidden { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .btn-toggle {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-hide { background: var(--danger); color: #fff; }
        .btn-show { background: var(--success); color: #fff; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-box">
            <h2>ZONE <span>SPORT</span></h2>
            <p>أدخل كلمة المرور للوصول للإدارة</p>
            <input type="password" id="passInput" class="login-input" placeholder="كلمة المرور..." onkeydown="if(event.key==='Enter') doLogin()">
            <button onclick="doLogin()" class="login-btn">دخول </button>
            <div id="errorText" class="error-msg"> كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- 2. لوحة التحكم -->
    <div id="adminSection" class="admin-content">
        <header>
            <div class="navbar">
                <a href="https://abdohady215-lang.github.io/" class="brand-logo">ZONE <span>SPORT</span> - الإدارة</a>
                <div>
                    <a href="https://abdohady215-lang.github.io/" class="btn-site">عرض الموقع </a>
                    <button onclick="doLogout()" class="logout-btn">خروج </button>
                </div>
            </div>
        </header>

        <main>
            <h1 class="page-title"> إدارة عرض الأخبار</h1>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th># المعرف</th>
                        <th>عنوان الخبر</th>
                        <th>التاريخ</th>
                        <th>الحالة</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="adminGrid">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 30px;">جاري تحميل الأخبار...</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <script>
        const BOT_TOKEN = "8983307628:AAEsacCBfEE6aCInlJ_2uv8UInmtlKM7W-U";
        const PASSWORD_CORRECT = "Abdo01155943060";

        // التحقق فور تحميل الصفحة
        document.addEventListener("DOMContentLoaded", function() {
            if (sessionStorage.getItem("is_admin_logged") === "true") {
                openAdmin();
            }
        });

        function doLogin() {
            const val = document.getElementById("passInput").value;
            const err = document.getElementById("errorText");

            if (val === PASSWORD_CORRECT) {
                sessionStorage.setItem("is_admin_logged", "true");
                openAdmin();
            } else {
                err.style.display = "block";
            }
        }

        function openAdmin() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("adminSection").style.display = "block";
            fetchAdminPosts();
        }

        function doLogout() {
            sessionStorage.removeItem("is_admin_logged");
            location.reload();
        }

        async function fetchAdminPosts() {
            const tbody = document.getElementById('adminGrid');
            const hiddenArticles = JSON.parse(localStorage.getItem('hidden_articles') || '[]');
            const timestamp = new Date().getTime();

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?_=${timestamp}`);
                const data = await res.json();

                if (data.ok && data.result.length > 0) {
                    tbody.innerHTML = '';
                    const validPosts = data.result.filter(item => item.channel_post || item.message).reverse();

                    validPosts.forEach(item => {
                        const msg = item.channel_post || item.message;
                        const id = msg.message_id;
                        let text = msg.text || msg.caption || "خبر بدون عنوان";
                        let title = text.split('\n')[0];
                        let date = new Date(msg.date * 1000).toLocaleDateString('ar-EG');
                        const isHidden = hiddenArticles.includes(id);

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><code>#${id}</code></td>
                            <td class="post-title-cell">${title}</td>
                            <td>${date}</td>
                            <td>
                                <span class="badge ${isHidden ? 'badge-hidden' : 'badge-visible'}">
                                    ${isHidden ? 'مخفي' : 'معروض'}
                                </span>
                            </td>
                            <td>
                                <button onclick="toggleVisibility(${id})" class="btn-toggle ${isHidden ? 'btn-show' : 'btn-hide'}">
                                    ${isHidden ? 'إظهار ' : 'إخفاء '}
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">لا توجد منشورات.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--danger); padding:20px;">خطأ في جلب البيانات من تليجرام.</td></tr>';
            }
        }

        function toggleVisibility(id) {
            let hiddenArticles = JSON.parse(localStorage.getItem('hidden_articles') || '[]');
            if (hiddenArticles.includes(id)) {
                hiddenArticles = hiddenArticles.filter(item => item !== id);
            } else {
                hiddenArticles.push(id);
            }
            localStorage.setItem('hidden_articles', JSON.stringify(hiddenArticles));
            fetchAdminPosts();
        }
    </script>
</body>
</html>
