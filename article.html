<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">تفاصيل الخبر - Zone Sport</title>
    
    <!-- كود إعلانات AdSense التلقائية -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

    <style>
        :root {
            --main-color: #d32f2f; /* أحمر أهلاوي */
            --dark-color: #111111;
            --bg-color: #f4f4f9;
            --text-color: #222222;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        header {
            background-color: var(--main-color);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .nav-back {
            display: inline-block;
            margin-top: 10px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 5px 12px;
            border-radius: 4px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .article-title {
            color: var(--dark-color);
            font-size: 26px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 10px;
        }

        .article-meta {
            font-size: 13px;
            color: #777;
            margin-bottom: 20px;
        }

        .article-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none; /* إخفاء الصورة افتراضياً لحين تحميلها */
        }

        .article-content {
            font-size: 18px;
            white-space: pre-line; /* للحفاظ على السطور والفقرات كما هي */
            color: #333;
        }

        .not-found {
            text-align: center;
            padding: 50px 20px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: var(--dark-color);
            color: white;
            margin-top: 40px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 15px;
            }
            .article-title {
                font-size: 20px;
            }
            .article-content {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Zone Sport - زون سبورت</h1>
        <a href="index.html" class="nav-back">← العودة للرئيسية</a>
    </header>

    <div class="container">
        <!-- مساحة إعلانية علوية -->
        <div style="text-align:center; margin-bottom: 15px;">
            <!-- ضع كود وحدة إعلانية هنا مستقبلاً -->
        </div>

        <div id="article-container">
            <h1 id="article-title" class="article-title">جاري تحميل الخبر...</h1>
            <div id="article-meta" class="article-meta"></div>
            <img id="article-image" class="article-image" src="" alt="صورة الخبر">
            <div id="article-content" class="article-content"></div>
        </div>

        <div id="not-found" class="not-found" style="display: none;">
            <h2>عذراً، لم يتم العثور على المقال!</h2>
            <p>قد يكون الرابط غير صحيح أو تم العثور على الخطأ في تحميل البيانات.</p>
            <a href="index.html" class="nav-back" style="background-color: var(--main-color);">الرجوع للصفحة الرئيسية</a>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © Zone Sport 2026</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // جلب بيانات المقال المخزنة من الصفحة الرئيسية
            const storedData = localStorage.getItem('currentArticle');

            if (storedData) {
                try {
                    const article = JSON.parse(storedData);

                    // تعبئة البيانات في الصفحة
                    document.getElementById('page-title').innerText = article.title + " - Zone Sport";
                    document.getElementById('article-title').innerText = article.title;
                    
                    // التاريخ أو المصدر إن وجد
                    if (article.date) {
                        document.getElementById('article-meta').innerText = "تاريخ النشر: " + article.date;
                    }

                    // عرض الصورة إن وجدت
                    if (article.image) {
                        const imgElem = document.getElementById('article-image');
                        imgElem.src = article.image;
                        imgElem.style.display = 'block';
                    }

                    // عرض النص الكامل
                    document.getElementById('article-content').innerText = article.text;

                } catch (e) {
                    showNotFound();
                }
            } else {
                showNotFound();
            }

            function showNotFound() {
                document.getElementById('article-container').style.display = 'none';
                document.getElementById('not-found').style.display = 'block';
            }
        });
    </script>
</body>
</html>
