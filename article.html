<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">تفاصيل الخبر - Zone Sport</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.8;
            direction: rtl;
            text-align: right;
            padding-bottom: 50px;
        }

        header {
            background: rgba(18, 21, 30, 0.95);
            border-bottom: 2px solid var(--brand-gold);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: var(--brand-gold);
            color: #000;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.9;
        }

        .article-container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .article-img-box {
            width: 100%;
            max-height: 450px;
            overflow: hidden;
            background: #1a1e29;
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-content {
            padding: 30px;
        }

        .article-date {
            color: var(--brand-gold);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .article-title-main {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .article-body-text {
            font-size: 1.1rem;
            color: #e2e8f0;
            white-space: pre-line;
            line-height: 1.9;
        }

        .error-box {
            text-align: center;
            padding: 60px 20px;
        }

        .error-box h2 { color: var(--brand-gold); margin-bottom: 15px; }
        .error-box p { color: var(--text-muted); margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="back-btn">← العودة للرئيسية</a>
            <span style="font-weight: 900; color: var(--brand-silver);">ZONE <span style="color:var(--brand-gold);">SPORT</span></span>
        </div>
    </header>

    <main class="article-container" id="articleWrapper">
        <!-- يتم تحميل تفاصيل الخبر هنا تلقائياً -->
    </main>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function loadArticleDetails() {
            const articleId = getQueryParam('id');
            const wrapper = document.getElementById('articleWrapper');

            // 1. القراءة من URL
            let title = getQueryParam('title');
            let text = getQueryParam('text');
            let img = getQueryParam('img');
            let date = getQueryParam('date');

            // فك التشفير للبيانات إذا وجدت في URL
            if (title) title = decodeURIComponent(title);
            if (text) text = decodeURIComponent(text);
            if (img) img = decodeURIComponent(img);
            if (date) date = decodeURIComponent(date);

            // 2. إذا لم تكن البيانات في الـ URL، جلبها من LocalStorage
            if ((!title || !text) && articleId) {
                const saved = localStorage.getItem(`article_${articleId}`);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        title = parsed.title;
                        text = parsed.text;
                        img = parsed.imgUrl;
                        date = parsed.date;
                    } catch(e) {}
                }
            }

            // 3. عرض المقال
            if (title || text) {
                document.getElementById('pageTitle').innerText = `${title || 'خبر'} - Zone Sport`;

                wrapper.innerHTML = `
                    <article class="article-card">
                        ${img ? `<div class="article-img-box"><img src="${img}" class="article-img" onerror="this.src='logo.png'"></div>` : ''}
                        <div class="article-content">
                            <div class="article-date">📅 ${date || 'Zone Sport'}</div>
                            <h1 class="article-title-main">${title || ''}</h1>
                            <div class="article-body-text">${text || ''}</div>
                        </div>
                    </article>
                `;
            } else {
                // عرض رسالة خطأ فقط إن لم تتوفر البيانات إطلاقاً
                wrapper.innerHTML = `
                    <div class="error-box">
                        <h2>عذراً، لم يتم العثور على المقال!</h2>
                        <p>قد يكون الرابط غير صحيح أو تم حذف الخبر.</p>
                        <a href="index.html" class="back-btn">الرجوع للصفحة الرئيسية</a>
                    </div>
                `;
            }
        }

        window.onload = loadArticleDetails;
    </script>
</body>
</html>
