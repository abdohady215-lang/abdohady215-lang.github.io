<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخبر - Zone Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: #ffffff; line-height: 1.6; min-height: 100vh; direction: rtl; text-align: right; }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky; top: 0; z-index: 100;
        }

        .navbar { max-width: 800px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { font-size: 1.6rem; font-weight: 900; color: var(--brand-silver); text-decoration: none; }
        .brand-logo span { color: var(--brand-gold); }

        .back-link {
            background: rgba(255, 184, 0, 0.1); border: 1px solid var(--brand-gold); color: var(--brand-gold);
            padding: 6px 16px; border-radius: 20px; font-weight: 700; text-decoration: none; font-size: 0.85rem; transition: 0.2s;
        }
        .back-link:hover { background: var(--brand-gold); color: #000; }

        main { max-width: 800px; margin: 30px auto; padding: 0 20px; }

        .article-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column;
        }

        .news-img-container { width: 100%; background: #000; text-align: center; }
        .news-img { width: 100%; height: auto; max-height: 550px; object-fit: contain; display: block; margin: 0 auto; }

        .news-content { padding: 30px; display: flex; flex-direction: column; }
        .news-date { font-size: 0.9rem; color: var(--brand-gold); margin-bottom: 12px; font-weight: 700; }
        .news-title { font-size: 1.6rem; font-weight: 900; color: #fff; margin-bottom: 20px; line-height: 1.4; }
        
        .news-body { font-size: 1.1rem; color: var(--text-muted); white-space: pre-line; margin-bottom: 30px; line-height: 1.9; }

        .card-actions {
            display: flex; gap: 10px; border-top: 1px solid var(--card-border); padding-top: 20px; margin-top: 5px;
        }
        .action-btn {
            flex: 1; text-align: center; background: rgba(255, 184, 0, 0.08); color: var(--brand-gold);
            border: 1px solid var(--brand-gold); padding: 12px; border-radius: 8px; font-weight: 700;
            text-decoration: none; font-size: 0.95rem; transition: 0.2s; cursor: pointer;
        }
        .action-btn:hover { background: var(--brand-gold); color: #000; }

        .error-box { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.1rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border); }

        footer { text-align: center; padding: 30px 20px; margin-top: 50px; border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <a href="index.html" class="back-link">العودة للرئيسية</a>
        </div>
    </header>

    <main>
        <div id="articleContainer"></div>
    </main>

    <footer>
        <p style="margin-bottom: 5px; font-weight: 700; color: var(--brand-silver);">Zone Sport - نبض النادي الأهلي</p>
        <p>جميع الحقوق محفوظة © 2026</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('articleContainer');
            const urlParams = new URLSearchParams(window.location.search);
            const postId = Number(urlParams.get('id'));

            const posts = JSON.parse(localStorage.getItem('zone_sport_posts') || '[]');
            const post = posts.find(p => p.id === postId);

            if (!post) {
                container.innerHTML = '<div class="error-box">عذراً، هذا الخبر غير موجود أو تم حذفه!</div>';
                return;
            }

            let imgHtml = post.image ? `
                <div class="news-img-container">
                    <img src="${post.image}" class="news-img" alt="${post.title}">
                </div>
            ` : '';

            const articleUrl = window.location.href;

            container.innerHTML = `
                <div class="article-card">
                    ${imgHtml}
                    <div class="news-content">
                        <span class="news-date">📅 ${post.date}</span>
                        <h1 class="news-title">${post.title}</h1>
                        <div class="news-body">${post.content}</div>
                        
                        <div class="card-actions">
                            <a href="index.html" class="action-btn">🏠 الرئيسية</a>
                            <button onclick="copyArticleLink('${articleUrl}', this)" class="action-btn">📋 نسخ رابط الخبر</button>
                        </div>
                    </div>
                </div>
            `;
        });

        function copyArticleLink(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ تم النسخ';
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            }).catch(err => {
                alert('فشل نسخ الرابط');
            });
        }
    </script>
</body>
</html>
