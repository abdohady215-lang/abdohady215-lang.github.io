<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179431800227143"
     crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GJKPFFFKT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9GJKPFFFKT');
    </script>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخبر - Zone Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
            --danger-red: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: #fff; line-height: 1.8; min-height: 100vh; direction: rtl; text-align: right; }

        header {
            background: rgba(18, 21, 30, 0.95);
            border-bottom: 2px solid var(--brand-gold);
            padding: 15px 20px;
            text-align: center;
        }
        .brand-logo { font-size: 1.5rem; font-weight: 900; color: var(--brand-silver); text-decoration: none; }
        .brand-logo span { color: var(--brand-gold); }

        .article-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .article-date { color: var(--brand-gold); font-weight: 700; font-size: 0.9rem; margin-bottom: 15px; }
        .article-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin-bottom: 20px; line-height: 1.4; }
        
        .article-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .article-body { font-size: 1.1rem; color: var(--text-muted); white-space: pre-line; margin-bottom: 30px; }

        .share-box {
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--card-border);
            padding-top: 20px;
            flex-wrap: wrap;
        }

        .share-btn {
            background: #1a1e29;
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }

        .share-btn:hover { background: var(--brand-gold); color: #000; }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: var(--brand-gold);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
    </header>

    <div class="article-container">
        <div class="article-card" id="articleCard">
            <p style="text-align:center; color: var(--text-muted);">جاري تحميل تفاصيل الخبر...</p>
        </div>
        <a href="index.html" class="back-home">← العودة إلى الرئيسية</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title');
        const text = urlParams.get('text');
        const date = urlParams.get('date');
        const img = urlParams.get('img');

        const card = document.getElementById('articleCard');

        if(title && text) {
            card.innerHTML = `
                <div class="article-date">📅 ${date || ''}</div>
                <h1 class="article-title">${decodeURIComponent(title)}</h1>
                <img src="${decodeURIComponent(img)}" class="article-img" alt="صورة الخبر">
                <div class="article-body">${decodeURIComponent(text)}</div>
                
                <div class="share-box">
                    <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(title + ' ' + window.location.href)}" target="_blank" class="share-btn">واتساب 📱</a>
                    <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn">فيسبوك 🌐</a>
                    <button onclick="navigator.clipboard.writeText(window.location.href); alert('تم نسخ رابط الخبر بنجاح!');" class="share-btn">نسخ الرابط 🔗</button>
                </div>
            `;
        } else {
            card.innerHTML = '<p style="text-align:center; color: var(--danger-red);">عذراً، لم يتم العثور على الخبر المطلوب.</p>';
        }
    </script>
</body>
</html>
