<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخبر - Zone Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.8;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 900px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
        }

        .brand-logo span { color: var(--brand-gold); }

        .back-btn {
            background: rgba(255, 184, 0, 0.1);
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: var(--brand-gold);
            color: #000;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .article-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 16px;
        }

        .article-date {
            font-size: 0.9rem;
            color: var(--brand-gold);
            font-weight: 700;
            margin-bottom: 12px;
            display: block;
        }

        .article-title {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .article-body {
            font-size: 1.1rem;
            color: var(--text-muted);
            white-space: pre-line;
        }

        .error-box {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.2rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <a href="index.html" class="back-btn">العودة للرئيسية</a>
        </div>
    </header>

    <main>
        <div id="articleBox" class="article-container">
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">جاري تحميل الخبر...</div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = Number(urlParams.get('id'));
            const container = document.getElementById('articleBox');

            const posts = JSON.parse(localStorage.getItem('zone_sport_posts') || '[]');
            const post = posts.find(p => p.id === postId);

            if (!post) {
                container.innerHTML = '<div class="error-box">عذراً، هذا الخبر غير موجود أو تم حذفه.</div>';
                return;
            }

            container.innerHTML = `
                <span class="article-date">📅 ${post.date}</span>
                <h1 class="article-title">${post.title}</h1>
                <div class="article-body">${post.content}</div>
            `;
        });
    </script>
</body>
</html>
