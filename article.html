<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخبر - Zone Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.8;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
        }

        .navbar {
            max-width: 900px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--brand-gold);
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--brand-gold);
            color: #000;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .article-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .article-date {
            color: var(--brand-gold);
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .article-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--brand-silver);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .article-img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .article-body {
            color: var(--text-muted);
            font-size: 1.05rem;
            white-space: pre-line;
            line-height: 2;
        }

        .loading-container {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,184,0,0.2);
            border-top: 4px solid var(--brand-gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <a href="index.html" class="back-btn">الرئيسية 🏠</a>
        </div>
    </header>

    <main>
        <div class="article-container" id="articleContent">
            <div class="loading-container">
                <div class="spinner"></div>
                <p>جاري تحميل تفاصيل الخبر...</p>
            </div>
        </div>
    </main>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://agmmvuhhxiowifpgrsjr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnbW12dWhoeGlvd2lmcGdyc2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MjUyMzcsImV4cCI6MjEwMzUwMTIzN30.S7LZudLlNGg7aq_FunAa6cVMaSzTHhG8Z5MI_8OxwtI';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadArticleDetail() {
            const container = document.getElementById('articleContent');
            
            // قراءة الـ id الخاص بالخبر من رابط الصفحة (مثال: article.html?id=5)
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                container.innerHTML = '<div style="text-align:center; color:#ef4444;">عذراً، لم يتم العثور على هذا الخبر.</div>';
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('articles')
                    .select('*')
                    .eq('id', articleId)
                    .single();

                if (error || !data) {
                    throw new Error('الخبر غير موجود');
                }

                let dateFormatted = new Date(data.created_at).toLocaleDateString('ar-EG', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });

                let imageHTML = data.image_url 
                    ? `<img src="${data.image_url}" class="article-img" onerror="this.remove()" alt="${data.title}">`
                    : '';

                container.innerHTML = `
                    <div class="article-date">📅 ${dateFormatted}</div>
                    <h1 class="article-title">${data.title}</h1>
                    ${imageHTML}
                    <div class="article-body">${data.body}</div>
                `;

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div style="text-align:center; color:#ef4444; padding:40px;">حدث خطأ أثناء جلب الخبر أو أن الخبر تم حذفه.</div>';
            }
        }

        window.onload = loadArticleDetail;
    </script>
</body>
</html>
