<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Sport - أخبار النادي الأهلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
        }

        .brand-logo span { color: var(--brand-gold); }

        .admin-link {
            background: rgba(255, 184, 0, 0.1);
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .admin-link:hover {
            background: var(--brand-gold);
            color: #000;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--brand-silver);
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 10px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--brand-gold);
        }

        .news-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-date {
            font-size: 0.8rem;
            color: var(--brand-gold);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .news-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-snippet {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more {
            align-self: flex-start;
            background: transparent;
            color: var(--brand-gold);
            border: 1px solid var(--brand-gold);
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .read-more:hover {
            background: var(--brand-gold);
            color: #000;
        }

        .empty-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.1rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <a href="admin.html" class="admin-link">لوحة التحكم</a>
        </div>
    </header>

    <main>
        <h2 class="section-title">آخر أخبار النادي الأهلي</h2>
        <div id="newsGrid" class="news-grid">
            <!-- سيتم تعبئة الأخبار ديناميكياً -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('newsGrid');
            const posts = JSON.parse(localStorage.getItem('zone_sport_posts') || '[]');

            if (posts.length === 0) {
                grid.innerHTML = '<div class="empty-box">لا توجد أخبار مضافة حتى الآن. اذهب إلى لوحة التحكم لإضافة أول خبر!</div>';
                return;
            }

            grid.innerHTML = '';
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div class="news-content">
                        <span class="news-date">${post.date}</span>
                        <h3 class="news-title">${post.title}</h3>
                        <p class="news-snippet">${post.content}</p>
                        <a href="article.html?id=${post.id}" class="read-more">قراءة المزيد</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
