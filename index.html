<html lang="ar" dir="rtl">
<head>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179431800227143"
     crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Sport - المنصة الإخبارية الرياضية الشاملة</title>
    <meta name="description" content="التغطية الأسرع والأشمل للأخبار الرياضية بالنادي الأهلي والمحلية والعالمية.">

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zonesport.me/">
    <meta property="og:title" content="Zone Sport - المنصة الإخبارية الرياضية الشاملة">
    <meta property="og:description" content="التغطية الأسرع والأشمل للأخبار الرياضية بالنادي الأهلي والمحلية والعالمية.">
    <meta property="og:image" content="logo.png">

    <!-- Twitter / X Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Zone Sport - المنصة الإخبارية الرياضية الشاملة">
    <meta name="twitter:description" content="التغطية الأسرع والأشمل للأخبار الرياضية بالنادي الأهلي والمحلية والعالمية.">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
            --danger-red: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        /* Navbar & Header */
        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .brand-logo span {
            color: var(--brand-gold);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Search Box */
        .search-box {
            background: #1a1e29;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 260px;
            transition: border-color 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--brand-gold);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
            width: 100%;
            text-align: right;
        }

        /* Admin Button */
        .admin-btn {
            background: transparent;
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .admin-btn:hover {
            background: var(--brand-gold);
            color: #000;
            box-shadow: 0 0 12px rgba(255, 184, 0, 0.4);
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            padding: 35px 20px 15px 20px;
            background: radial-gradient(circle at top, rgba(255, 184, 0, 0.1) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--brand-silver);
        }

        .hero h1 span {
            color: var(--brand-gold);
        }

        /* Categories Tabs */
        .categories-container {
            max-width: 1200px;
            margin: 15px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            direction: rtl;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--brand-gold);
            color: #000;
            border-color: var(--brand-gold);
        }

        /* News Cards Grid */
        main {
            max-width: 1200px;
            margin: 20px auto 40px auto;
            padding: 0 20px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--brand-gold);
            box-shadow: 0 15px 30px rgba(255, 184, 0, 0.2);
        }

        .card-img-container {
            width: 100%;
            height: 210px;
            background: #1a1e29;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.08);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-date {
            font-size: 0.8rem;
            color: var(--brand-gold);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.5;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        /* أزرار الإجراءات داخل الكارت */
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .read-more {
            flex: 2;
            text-align: center;
            background: linear-gradient(135deg, var(--brand-gold) 0%, #D49A00 100%);
            color: #000;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .read-more:hover {
            opacity: 0.9;
        }

        .copy-btn {
            flex: 1;
            background: #1a1e29;
            color: var(--brand-silver);
            border: 1px solid var(--card-border);
            padding: 10px 0;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--brand-gold);
            color: #000;
            border-color: var(--brand-gold);
        }

        .spinner-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,184,0,0.3);
            border-top: 4px solid var(--brand-gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        footer {
            border-top: 1px solid var(--card-border);
            padding: 25px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            background: #06070a;
        }

        @media (max-width: 600px) {
            .navbar { flex-direction: column; gap: 15px; align-items: stretch; }
            .header-actions { flex-direction: column-reverse; width: 100%; }
            .search-box { width: 100%; }
            .admin-btn { width: 100%; text-align: center; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <div class="header-actions">
                <div class="search-box">
                    <span style="color: var(--brand-gold);">🔍</span>
                    <input type="text" id="searchInput" placeholder="ابحث في الأخبار...">
                </div>
                <button onclick="openAdminModal()" class="admin-btn">🔑 لوحة التحكم</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>ZONE <span>SPORT</span></h1>
        <p style="color: var(--text-muted);">التغطية الأسرع والأشمل للأخبار الرياضية بالنادي الأهلي</p>
    </section>

    <div class="categories-container">
        <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('الأهلي', this)">أخبار الأهلي</button>
        <button class="cat-btn" onclick="filterCategory('الدوري', this)">الدوري المصري</button>
        <button class="cat-btn" onclick="filterCategory('عالمي', this)">عالمي</button>
    </div>

    <main>
        <div class="news-grid" id="newsGrid">
            <div class="spinner-box">
                <div class="spinner"></div>
                <p>جاري تحميل الاخبار</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Zone Sport. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        const BOT_TOKEN = "8983307628:AAEsacCBfEE6aCInlJ_2uv8UInmtlKM7W-U";
        let allArticles = [];

        function openAdminModal() {
            const ADMIN_PASSWORD = "Abdo01155943060";
            let password = prompt("برجاء إدخال كلمة سر الأدمن للدخول إلى لوحة التحكم:");

            if (password === null) return;

            if (password === ADMIN_PASSWORD) {
                alert("تم التحقق بنجاح! جاري التوجيه...");
                window.location.href = "admin.html";
            } else {
                alert("كلمة السر غير صحيحة!");
            }
        }

        async function loadArticles() {
            const timestamp = new Date().getTime();

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?_=${timestamp}`);
                const data = await res.json();
                const grid = document.getElementById('newsGrid');

                if (data.ok && data.result.length > 0) {
                    const validPosts = data.result.filter(item => item.channel_post || item.message);
                    const hiddenArticles = JSON.parse(localStorage.getItem('hidden_articles') || '[]');
                    
                    const articlesPromises = validPosts.reverse().map(async (item) => {
                        const msg = item.channel_post || item.message;
                        const msgId = msg.message_id;

                        if (hiddenArticles.includes(msgId)) return null;

                        let text = msg.text || msg.caption || "تغطية خاصة - Zone Sport";
                        let title = text.split('\n')[0];
                        let date = new Date(msg.date * 1000).toLocaleDateString('ar-EG', {
                            year: 'numeric', month: 'long', day: 'numeric'
                        });

                        let imgUrl = "logo.png";
                        if (msg.photo && msg.photo.length > 0) {
                            const fileId = msg.photo[msg.photo.length - 1].file_id;
                            imgUrl = await fetchTelegramFile(fileId);
                        }

                        return { id: msgId, title, text, date, imgUrl };
                    });

                    const results = await Promise.all(articlesPromises);
                    allArticles = results.filter(art => art !== null);

                    renderCards(allArticles);
                } else {
                    grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">لا توجد أخبار جديدة حالياً.</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('newsGrid').innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#ef4444;">حدث خطأ أثناء تحميل الأخبار.</p>';
            }
        }

        function renderCards(articles) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';
            
            if(articles.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">لا توجد نتائج مطابقة لبحثك.</p>';
                return;
            }

            articles.forEach(art => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `post-${art.id}`;
                
                const detailUrl = `article.html?id=${art.id}&title=${encodeURIComponent(art.title)}&text=${encodeURIComponent(art.text)}&date=${encodeURIComponent(art.date)}&img=${encodeURIComponent(art.imgUrl)}`;

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${art.imgUrl}" class="card-img" alt="صورة الخبر" loading="lazy" onerror="this.src='logo.png'">
                    </div>
                    <div class="card-body">
                        <div class="card-date">📅 ${art.date}</div>
                        <h2 class="card-title">${art.title}</h2>
                        <p class="card-text">${art.text}</p>
                        <div class="card-actions">
                            <a href="${detailUrl}" class="read-more">التفاصيل الكاملة</a>
                            <button onclick="copyPostLink('${art.id}')" class="copy-btn">📋 نسخ الرابط</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function copyPostLink(postId) {
            const shortUrl = `${window.location.origin}${window.location.pathname}#post-${postId}`;
            
            navigator.clipboard.writeText(shortUrl).then(() => {
                alert(`✅ تم نسخ رابط الخبر بنجاح:\n${shortUrl}`);
            }).catch(err => {
                console.error('فشل عملية النسخ:', err);
            });
        }

        async function fetchTelegramFile(fileId) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok) return `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
            } catch (e) {}
            return "logo.png";
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allArticles.filter(art => 
                art.title.toLowerCase().includes(term) || art.text.toLowerCase().includes(term)
            );
            renderCards(filtered);
        });

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(cat === 'all') {
                renderCards(allArticles);
            } else {
                const filtered = allArticles.filter(art => art.text.includes(cat) || art.title.includes(cat));
                renderCards(filtered);
            }
        }

        window.onload = loadArticles;
    </script>
</body>
</html>
