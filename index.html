<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Sport - الأخبار الرياضية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        /* Navbar */
        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--brand-gold);
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: var(--brand-gold);
            color: #000;
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .hero h1 {
            font-size: 2.2rem;
            color: var(--brand-silver);
            margin-bottom: 8px;
        }

        .hero h1 span {
            color: var(--brand-gold);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Main Grid Container */
        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* News Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--brand-gold);
        }

        .card-img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-date {
            color: var(--brand-gold);
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--brand-silver);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-excerpt {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-read {
            flex: 2;
            background: var(--brand-gold);
            color: #000;
            text-align: center;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .btn-read:hover {
            opacity: 0.9;
        }

        .btn-share {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--brand-silver);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-share:hover {
            background: rgba(255, 184, 0, 0.1);
            color: var(--brand-gold);
        }

        /* Spinner & Empty State */
        .loading-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,184,0,0.2);
            border-top: 4px solid var(--brand-gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <a href="admin.html" class="admin-btn">لوحة التحكم ⚙️</a>
        </div>
    </header>

    <section class="hero">
        <h1>أحدث <span>الأخبار الرياضية</span></h1>
        <p>متابعة لحظية وتغطية خاصة لكافة الأحداث والبطولات</p>
    </section>

    <main>
        <div class="news-grid" id="newsGrid">
            <div class="loading-container">
                <div class="spinner"></div>
                <p>جاري تحميل أحدث الأخبار...</p>
            </div>
        </div>
    </main>

    <script>
        const BOT_TOKEN = "8983307628:AAEsacCBfEE6aCInlJ_2uv8UInmtlKM7W-U";

        async function loadNews() {
            const grid = document.getElementById('newsGrid');
            const timestamp = new Date().getTime();

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?_=${timestamp}`);
                const data = await res.json();

                if (data.ok && data.result.length > 0) {
                    const hiddenArticles = JSON.parse(localStorage.getItem('hidden_articles') || '[]');
                    
                    const validPosts = data.result
                        .filter(item => item.channel_post || item.message)
                        .filter(item => {
                            const msgId = (item.channel_post || item.message).message_id;
                            return !hiddenArticles.includes(msgId);
                        });

                    if (validPosts.length === 0) {
                        grid.innerHTML = '<div class="loading-container"><p>لا توجد أخبار معروضة حالياً.</p></div>';
                        return;
                    }

                    const articlesPromises = validPosts.reverse().map(async (item) => {
                        const msg = item.channel_post || item.message;
                        const msgId = msg.message_id;
                        let text = msg.text || msg.caption || "تغطية خاصة - Zone Sport";
                        
                        const lines = text.split('\n').filter(l => l.trim() !== '');
                        let title = lines[0] || "خبر رياضي عاجل";
                        let excerpt = lines.slice(1).join(' ') || text;

                        let date = new Date(msg.date * 1000).toLocaleDateString('ar-EG', {
                            year: 'numeric', month: 'short', day: 'numeric'
                        });

                        let imgUrl = null;
                        if (msg.photo && msg.photo.length > 0) {
                            const fileId = msg.photo[msg.photo.length - 1].file_id;
                            imgUrl = await fetchTelegramFile(fileId);
                        }

                        return { id: msgId, title, excerpt, date, imgUrl };
                    });

                    const articles = await Promise.all(articlesPromises);
                    renderCards(articles);

                } else {
                    grid.innerHTML = '<div class="loading-container"><p>لا توجد أخبار حالياً.</p></div>';
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="loading-container" style="color:#ef4444;"><p>حدث خطأ أثناء تحميل الأخبار.</p></div>';
            }
        }

        function renderCards(articles) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            articles.forEach(art => {
                const detailUrl = `article.html?id=${art.id}`;
                
                const imageHTML = art.imgUrl 
                    ? `<img src="${art.imgUrl}" class="card-img" onerror="this.remove()" alt="${art.title}">`
                    : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.id = `post-${art.id}`;
                card.innerHTML = `
                    ${imageHTML}
                    <div class="card-body">
                        <div class="card-date">📅 ${art.date}</div>
                        <h2 class="card-title">${art.title}</h2>
                        <p class="card-excerpt">${art.excerpt}</p>
                        <div class="card-footer">
                            <a href="${detailUrl}" class="btn-read">اقرأ الخبر كاملاً </a>
                            <button onclick="copyPostLink(${art.id})" class="btn-share">مشاركة 🔗</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (window.location.hash) {
                const targetElement = document.querySelector(window.location.hash);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth' });
                }
            }
        }

        async function fetchTelegramFile(fileId) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok) return `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
            } catch (e) {}
            return null;
        }

        function copyPostLink(id) {
            const link = `${window.location.origin}${window.location.pathname}#post-${id}`;
            navigator.clipboard.writeText(link).then(() => {
                alert('تم نسخ رابط الخبر بنجاح!');
            });
        }

        window.onload = loadNews;
    </script>
</body>
</html>
