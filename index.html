<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Sport - الأرشيف الرياضي</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 10px;
            background: #161b22;
            border-bottom: 2px solid #cc0000;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        /* شبكة المربعات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        /* تصميم المربع الخاص بالخبر */
        .news-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .news-card:hover {
            transform: translateY(-5px);
            border-color: #cc0000;
        }
        .news-title {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .news-snippet {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .btn-read {
            background: #cc0000;
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-read:hover { background: #ff0000; }
    </style>
</head>
<body>

    <header>
        <h1>🦅 Zone Sport</h1>
        <p>أحدث أخبار النادي الأهلي والكرة المصرية</p>
    </header>

    <div class="grid-container" id="newsGrid">
        <p style="text-align: center; width: 100%;">جاري تحميل الأخبار... ⏳</p>
    </div>

    <script>
        const BOT_TOKEN = "8983307628:AAEsacCBfEE6aCInlJ_2uv8UInmtlKM7W-U";

        function loadTelegramPosts() {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('newsGrid');
                grid.innerHTML = '';

                if(data.ok && data.result.length > 0) {
                    data.result.reverse().forEach(item => {
                        const msg = item.channel_post || item.message;
                        if(msg && msg.text) {
                            const fullText = msg.text;
                            const title = fullText.split('\n')[0]; // أول سطر عنوان
                            const msgId = msg.message_id;

                            const card = document.createElement('div');
                            card.className = 'news-card';
                            card.innerHTML = `
                                <div>
                                    <h3 class="news-title">${title}</h3>
                                    <p class="news-snippet">${fullText}</p>
                                </div>
                                <a href="news.html?id=${msgId}" class="btn-read">اقرأ الخبر كاملاً 👈</a>
                            `;
                            grid.appendChild(card);
                        }
                    });
                } else {
                    grid.innerHTML = '<p style="text-align: center;">لا توجد أخبار حالياً، قم بنشر خبر في القناة أولاً!</p>';
                }
            });
        }

        window.onload = loadTelegramPosts;
    </script>

</body>
</html>
