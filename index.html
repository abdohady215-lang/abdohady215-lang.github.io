<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Sport - أخبار النادي الأهلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
    /* --- المقترح الثالث: تأثير زووم ناعم للصورة + إضاءة ذهبية فخمة للكارت عند الماوس --- */
    .news-card {
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) !important;
        position: relative;
    }
    
    .news-img-container {
        overflow: hidden !important; /* لضمان عدم خروج الصورة عن إطار الكارت أثناء الزووم */
    }

    .news-img {
        transition: transform 0.6s ease !important;
    }

    .news-card:hover .news-img {
        transform: scale(1.05) !important; /* تكبير ناعم جداً وجذاب للصورة */
    }

    .news-card:hover {
        transform: translateY(-6px) !important;
        box-shadow: 0 12px 30px rgba(255, 184, 0, 0.18), 0 0 15px rgba(255, 184, 0, 0.08) !important;
        border-color: var(--brand-gold) !important;
    }

    /* --- المقترح الخامس: عنوان القسم بخط سفلي متدرج وساحر --- */
    .section-title {
        position: relative !important;
        display: inline-block !important;
        margin-bottom: 30px !important;
        border-bottom: none !important; /* إلغاء الخط القديم العادي */
        padding-bottom: 5px !important;
    }

    .section-title::after {
        content: '' !important;
        position: absolute !important;
        bottom: 0 !important;
        right: 0 !important;
        width: 100% !important;
        height: 3px !important;
        background: linear-gradient(90deg, var(--brand-gold), transparent) !important;
        border-radius: 2px !important;
    }
</style>
    <style>
    /* تعديل الهيدر ليصبح الشعار في المنتصف تماماً */
    .navbar {
        display: flex !important;
        justify-content: center !important;
        position: relative !important;
    }
    .brand-logo {
        position: absolute !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
    }
    /* إبعاد أي أزرار جانبية (مثل لوحة التحكم أو العودة) عن الشعار لكي لا تتداخل معه */
    .navbar > *:not(.brand-logo) {
        position: absolute !important;
        left: 20px !important;
    }
    /* إذا كان الزر على اليسار أو اليمين حسب اتجاه الموقع */
    .navbar .admin-link, .navbar .back-link {
        right: 20px !important;
        left: auto !important;
    }
</style>
    <style>
    /* تأثير المربع الزجاجي والتبرز عند مرور الماوس */
    .news-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease !important;
    }
    .news-card:hover {
        transform: translateY(-8px) scale(1.01) !important;
        box-shadow: 0 15px 35px rgba(255, 184, 0, 0.15) !important;
        border-color: var(--brand-gold) !important;
    }
</style>
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: #ffffff; line-height: 1.6; min-height: 100vh; direction: rtl; text-align: right; }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky; top: 0; z-index: 100;
        }

        .navbar { max-width: 800px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { font-size: 1.6rem; font-weight: 900; color: var(--brand-silver); text-decoration: none; }
        .brand-logo span { color: var(--brand-gold); }

        .admin-link {
            display: none;
            background: rgba(255, 184, 0, 0.1); border: 1px solid var(--brand-gold); color: var(--brand-gold);
            padding: 6px 16px; border-radius: 20px; font-weight: 700; text-decoration: none; font-size: 0.85rem; transition: 0.2s;
        }
        .admin-link:hover { background: var(--brand-gold); color: #000; }

        main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-size: 1.5rem; margin-bottom: 25px; color: var(--brand-silver); border-bottom: 2px solid var(--card-border); padding-bottom: 10px; }

        .news-feed { display: flex; flex-direction: column; gap: 25px; }

        .news-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column;
        }

        .news-img-container { width: 100%; background: #000; text-align: center; }
        .news-img { width: 100%; height: auto; max-height: 550px; object-fit: contain; display: block; margin: 0 auto; }

        .news-content { padding: 25px; display: flex; flex-direction: column; }
        .news-date { font-size: 0.85rem; color: var(--brand-gold); margin-bottom: 10px; font-weight: 700; }
        .news-title { font-size: 1.3rem; font-weight: 900; color: #fff; margin-bottom: 15px; line-height: 1.4; }
        
        .news-body { font-size: 1.05rem; color: var(--text-muted); white-space: pre-line; margin-bottom: 25px; line-height: 1.8; }

        .card-actions {
            display: flex; gap: 10px; border-top: 1px solid var(--card-border); padding-top: 15px; margin-top: 5px;
        }
        .action-btn {
            flex: 1; text-align: center; background: rgba(255, 184, 0, 0.08); color: var(--brand-gold);
            border: 1px solid var(--brand-gold); padding: 10px; border-radius: 8px; font-weight: 700;
            text-decoration: none; font-size: 0.9rem; transition: 0.2s; cursor: pointer;
        }
        .action-btn:hover { background: var(--brand-gold); color: #000; }

        .empty-box { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.1rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border); }

        footer { text-align: center; padding: 30px 20px; margin-top: 50px; border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <script src="fb-fix.js"></script>

    <header>
        <div class="navbar">
            <a href="index.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <a href="admin.html" id="adminNavBtn" class="admin-link">لوحة التحكم</a>
        </div>
    </header>

    <main>
        <h2 class="section-title">آخر أخبار النادي الأهلي</h2>
        <div id="newsFeed" class="news-feed"></div>
    </main>

    <footer>
        <p style="margin-bottom: 5px; font-weight: 700; color: var(--brand-silver);">Zone Sport - نبض النادي الأهلي</p>
        <p>جميع الحقوق محفوظة © 2026 | إشراف وإدارة البيج</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem("is_admin_logged") === "true") {
                document.getElementById('adminNavBtn').style.display = 'inline-block';
            }

            const feed = document.getElementById('newsFeed');
            const posts = JSON.parse(localStorage.getItem('zone_sport_posts') || '[]');

            if (posts.length === 0) {
                feed.innerHTML = '<div class="empty-box">لا توجد أخبار مضافة حتى الآن.</div>';
                return;
            }

            feed.innerHTML = '';
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'news-card';
                
                let imgHtml = post.image ? `
                    <div class="news-img-container">
                        <img src="${post.image}" class="news-img" alt="${post.title}">
                    </div>
                ` : '';

                const articleUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}article.html?id=${post.id}`;

                card.innerHTML = `
                    ${imgHtml}
                    <div class="news-content">
                        <span class="news-date">📅 ${post.date}</span>
                        <h3 class="news-title">${post.title}</h3>
                        <div class="news-body">${post.content}</div>
                        
                        <div class="card-actions">
                            <a href="article.html?id=${post.id}" class="action-btn">🔗 التفاصيل</a>
                            <button onclick="copyArticleLink('${articleUrl}', this)" class="action-btn">📋 نسخ الرابط</button>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        });

        function copyArticleLink(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ تم النسخ';
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            }).catch(err => {
                alert('فشل نسخ الرابط');
            });
        }
    </script>
    
</body>
</html>
