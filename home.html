<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gold: #FFB800;
            --brand-silver: #E2E8F0;
            --dark-bg: #090A0F;
            --card-bg: #12151E;
            --card-border: rgba(255, 184, 0, 0.15);
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        header {
            background: rgba(18, 21, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--brand-gold);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--brand-silver);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--brand-gold);
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: var(--brand-gold);
            color: #000;
        }

        .hero {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .hero h1 {
            font-size: 2.2rem;
            color: var(--brand-silver);
            margin-bottom: 8px;
        }

        .hero h1 span {
            color: var(--brand-gold);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--brand-gold);
        }

        .card-img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-date {
            color: var(--brand-gold);
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--brand-silver);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-excerpt {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
            white-space: pre-line;
        }

        .card-footer {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-share {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--brand-silver);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-share:hover {
            background: rgba(255, 184, 0, 0.1);
            color: var(--brand-gold);
        }

        .loading-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,184,0,0.2);
            border-top: 4px solid var(--brand-gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="home.html" class="brand-logo">ZONE <span>SPORT</span></a>
            <a href="admin.html" class="admin-btn">لوحة التحكم ⚙️</a>
        </div>
    </header>

    <section class="hero">
        <h1>أحدث <span>الأخبار الرياضية</span></h1>
        <p>متابعة لحظية وتغطية خاصة لكافة الأحداث والبطولات</p>
    </section>

    <main>
        <div class="news-grid" id="newsGrid">
            <div class="loading-container">
                <div class="spinner"></div>
                <p>جاري تحميل أحدث الأخبار...</p>
            </div>
        </div>
    </main>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://agmmvuhhxiowifpgrsjr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnbW12dWhoeGlvd2lmcGdyc2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MjUyMzcsImV4cCI6MjEwMzUwMTIzN30.S7LZudLlNGg7aq_FunAa6cVMaSzTHhG8Z5MI_8OxwtI';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadNews() {
            const grid = document.getElementById('newsGrid');

            try {
                const { data, error } = await supabaseClient
                    .from('articles')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="loading-container"><p>لا توجد أخبار منشورة حالياً.</p></div>';
                    return;
                }

                grid.innerHTML = '';

                data.forEach(art => {
                    let dateFormatted = new Date(art.created_at).toLocaleDateString('ar-EG', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });

                    let imageHTML = art.image_url 
                        ? `<img src="${art.image_url}" class="card-img" onerror="this.remove()" alt="${art.title}">`
                        : '';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.id = `post-${art.id}`;
                    card.innerHTML = `
                        ${imageHTML}
                        <div class="card-body">
                            <div class="card-date">📅 ${dateFormatted}</div>
                            <h2 class="card-title">${art.title}</h2>
                            <p class="card-excerpt">${art.body}</p>
                            <div class="card-footer">
                                <button onclick="copyPostLink(${art.id})" class="btn-share">مشاركة 🔗</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                if (window.location.hash) {
                    const targetElement = document.querySelector(window.location.hash);
                    if (targetElement) {
                        targetElement.scrollIntoView({ behavior: 'smooth' });
                    }
                }

            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="loading-container" style="color:#ef4444;"><p>حدث خطأ أثناء تحميل الأخبار من قاعدة البيانات.</p></div>';
            }
        }

        function copyPostLink(id) {
            const link = `${window.location.origin}${window.location.pathname}#post-${id}`;
            navigator.clipboard.writeText(link).then(() => {
                alert('تم نسخ رابط الخبر بنجاح!');
            });
        }

        window.onload = loadNews;
    </script>
</body>
</html>
